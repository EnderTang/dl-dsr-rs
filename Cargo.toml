[workspace]
resolver = "2"
members = [
  "crates/dldsr-core",
  "crates/dldsr-node",
  "crates/dldsr-bench",
  "crates/dldsr-uring",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = "https://github.com/example/dl-dsr-rs"

[workspace.dependencies]
anyhow = "1"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1.37", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"

